.mono{font-family:"IBM Plex Mono","IBM Plex Sans Thai",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.display{font-family:"Archivo","IBM Plex Sans Thai",system-ui,sans-serif}
.title-lg{font-family:"Archivo","IBM Plex Sans Thai",sans-serif;font-weight:800;font-size:17px}

.shell{
  max-width:480px;
  margin:0 auto;
  min-height:100dvh;
  background:var(--paper);
  display:flex;
  flex-direction:column;
  position:relative;
  box-shadow:0 0 60px var(--shadow);
}
@media (min-width:481px){
  body{ padding:24px 0; }
  .shell{ min-height:calc(100dvh - 48px); border-radius:22px; overflow:hidden; }
}

/* topbar */
.topbar{
  background:linear-gradient(160deg,var(--brand-surface),#123a9e 65%,var(--brand-surface));
  color:#fff;
  padding:14px 16px 12px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  position:sticky; top:0; z-index:20;
}
.brand-row{display:flex;align-items:center;gap:9px}
.mark{width:30px;height:30px;flex:none}
.brand-word{line-height:1.05}
.brand-word b{display:block;font-family:"Archivo";font-weight:800;font-size:19px;letter-spacing:.2px}
.brand-word span{display:block;font-family:"Archivo";font-weight:700;font-size:11px;letter-spacing:2.4px;color:#BFD0FF;margin-top:1px}
.rolebadgerow{margin-top:7px; display:flex; gap:6px; align-items:center}
.rolebadge{
  font-size:10.5px; font-weight:700; letter-spacing:.3px;
  background:rgba(255,255,255,.16); color:#fff; border:none; padding:4px 9px;
  border-radius:999px; display:inline-block;
}
.rolebadge:active{background:rgba(255,255,255,.28)}
.rolebadge.langtoggle{background:rgba(255,255,255,.28);font-family:"IBM Plex Mono",monospace;letter-spacing:.5px}
.rolebadge.langtoggle:active{background:rgba(255,255,255,.42)}
.clockbox{text-align:right}
.clock{font-family:"IBM Plex Mono";font-weight:600;font-size:16px;letter-spacing:.5px}
.clockdate{font-size:10.5px;color:#BFD0FF;margin-top:2px}
.syncrow{display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:4px;font-size:10px;color:#BFD0FF}
.syncdot{width:6px;height:6px;border-radius:50%;background:#8FE3B8;flex:none}
.syncdot.local{background:#C7D2EB}
.syncdot.saving{background:#F4C563;animation:pulse 1s infinite}
.syncdot.err{background:#F17683}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.syncdot.saving{animation:none}}

/* tabs */
.tabs{
  display:flex; gap:6px; padding:12px 16px 0; background:var(--paper);
}
.tab{
  flex:1; text-align:center; padding:9px 4px; border-radius:10px;
  border:1px solid var(--line); background:var(--surface);
  font-size:13px; font-weight:600; color:var(--ink-dim);
  display:flex; flex-direction:column; align-items:center; gap:2px;
}
.tab .n{font-family:"IBM Plex Mono";font-size:15px;font-weight:600;color:var(--ink)}
.tab.active{background:var(--brand);border-color:var(--brand);color:#fff}
.tab.active .n{color:#fff}
.dayheading{
  padding:14px 16px 0; font-size:11px; font-weight:700; letter-spacing:1.6px;
  text-transform:uppercase; color:var(--ink-faint);
}

/* kpi strip */
.kpis{
  display:flex; gap:8px; padding:12px 16px; overflow-x:auto;
  scrollbar-width:none;
}
.kpis::-webkit-scrollbar{display:none}
.kpi{
  flex:none; min-width:92px; background:var(--surface); border:1px solid var(--line);
  border-radius:12px; padding:9px 12px; box-shadow:0 1px 2px var(--shadow);
  transition:background .2s,border-color .2s;
}
.kpi .v{font-family:"IBM Plex Mono";font-weight:600;font-size:19px;line-height:1.1}
.kpi .l{font-size:10.5px;color:var(--ink-dim);margin-top:2px;white-space:nowrap}
.kpi.bad{background:var(--bad-soft);border-color:transparent}
.kpi.bad .v{color:var(--bad)}
.kpi.bad .l{color:var(--bad);opacity:.8}
.kpi.warn{background:var(--warn-soft);border-color:transparent}
.kpi.warn .v{color:var(--warn)}
.kpi.warn .l{color:var(--warn);opacity:.8}
.kpi.good{background:var(--good-soft);border-color:transparent}
.kpi.good .v{color:var(--good)}
.kpi.good .l{color:var(--good);opacity:.8}

/* list */
.list{padding:4px 16px 100px;display:flex;flex-direction:column;gap:10px;flex:1}
.empty{
  margin-top:30px;text-align:center;color:var(--ink-faint);font-size:13.5px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.empty-icon{font-size:38px;opacity:.7}
.list-end{text-align:center;font-size:11.5px;color:var(--ink-faint);margin:16px 0 8px;letter-spacing:.2px}
.section-label{
  font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--ink-faint);margin:10px 2px 0;
}
.card{
  display:flex; text-align:left; width:100%; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
  cursor:pointer; -webkit-tap-highlight-color:transparent;
  box-shadow:0 1px 3px var(--shadow); transition:transform .1s,background .15s;
}
.card:active{background:var(--surface-2); transform:scale(.99)}
.stripe{width:5px;flex:none}
.stripe.pending{background:var(--ink-faint)}
.stripe.urgent{background:var(--bad)}
.stripe.scheduled{background:var(--brand)}
.stripe.late{background:var(--bad)}
.stripe.unloading{background:var(--warn)}
.stripe.done{background:var(--good)}
.card-body{padding:11px 13px;flex:1;min-width:0}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-id{font-family:"IBM Plex Mono";font-weight:600;font-size:14.5px}
.pill{
  font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;flex:none;
  white-space:nowrap;
}
.pill.pending{background:var(--surface-3);color:var(--ink-dim)}
.pill.urgent{background:var(--bad-soft);color:var(--bad)}
.pill.scheduled{background:var(--brand-soft);color:var(--brand)}
.pill.late{background:var(--bad-soft);color:var(--bad)}
.pill.unloading{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--good-soft);color:var(--good)}
.card-carrier{font-size:13.5px;font-weight:600;margin-top:4px;color:var(--ink)}
.card-meta{font-size:11.5px;color:var(--ink-dim);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.card-meta span:not(:last-child)::after{content:"·";margin-left:6px;color:var(--line-strong)}

/* fab */
.fab{
  position:absolute; right:18px; bottom:22px; z-index:15;
  width:56px;height:56px;border-radius:18px;border:none;
  background:var(--brand); color:#fff; font-size:28px; font-weight:600;
  box-shadow:0 8px 20px var(--shadow); display:flex;align-items:center;justify-content:center;
  line-height:1;
}
.fab:active{background:var(--brand-ink)}

/* sheet */
.scrim{
  position:absolute; inset:0; background:rgba(8,14,28,.45); z-index:30;
  display:flex; align-items:flex-end;
}
.scrim.photoscrim{z-index:40}
.photo-preview{width:100%;border-radius:12px;border:1px solid var(--line);display:block;margin-top:4px}
.photo-pick{
  display:block;text-align:center;width:100%;border:1px solid var(--line-strong);background:var(--surface);
  border-radius:13px;padding:14px 16px;font-weight:700;font-size:14.5px;margin-top:10px;cursor:pointer;
}
.photo-pick:active{background:var(--surface-2)}
.sheet{
  width:100%; background:var(--surface); border-radius:20px 20px 0 0;
  max-height:88%; overflow-y:auto; padding:8px 20px calc(20px + env(safe-area-inset-bottom));
  animation:slideup .22s ease-out;
}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
@keyframes slideup{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet-handle{width:36px;height:4px;background:var(--line-strong);border-radius:2px;margin:8px auto 10px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet-id{font-family:"IBM Plex Mono";font-weight:600;font-size:16px}
.sheet-carrier{font-size:14px;color:var(--ink-dim);margin-top:2px;font-weight:500}
.sheet-close{
  border:none;background:var(--surface-2);width:30px;height:30px;border-radius:9px;
  font-size:16px;color:var(--ink-dim);flex:none;
}
.sheet-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{
  font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:8px;
  background:var(--surface-2);color:var(--ink-dim);
}
.sheet-section{margin-top:20px}
.label{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-faint)}
.field{
  width:100%;margin-top:8px;padding:12px 13px;border-radius:11px;border:1px solid var(--line-strong);
  background:var(--surface);font-size:16px;
}
.field:focus{outline:2px solid var(--brand);outline-offset:1px}
.timer{
  font-family:"IBM Plex Mono";font-weight:600;font-size:38px;text-align:center;
  margin:14px 0 4px;letter-spacing:1px;
}
.timer.big-late{color:var(--bad)}
.timer.big-work{color:var(--warn)}
.timer-sub{text-align:center;font-size:12.5px;color:var(--ink-dim)}
.done-summary{display:flex;justify-content:space-around;text-align:center;margin:16px 0 6px}
.done-summary div b{display:block;font-family:"IBM Plex Mono";font-size:17px;font-weight:600}
.done-summary div span{font-size:10.5px;color:var(--ink-dim)}
.btn{
  width:100%;border:none;border-radius:13px;padding:15px 16px;font-weight:700;font-size:15.5px;
  margin-top:14px;text-align:center; transition:transform .1s,opacity .1s;
}
.btn:active{opacity:.85; transform:scale(.98)}
.btn.primary{background:var(--brand);color:#fff}
.btn.go{background:var(--good);color:#fff}
.btn.stop{background:var(--warn);color:#1c1204}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.linklike{
  display:block;text-align:center;width:100%;border:none;background:none;
  font-size:13px;color:var(--ink-faint);padding:12px 0 4px;font-weight:600;
}
.linklike.danger{color:var(--bad)}
.formgrid{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.hint{font-size:11.5px;color:var(--ink-faint);margin-top:6px;line-height:1.4}

/* shipment details (read-only, from the sheet) */
.detailgrid{margin-top:8px;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.detailrow{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;font-size:12.5px}
.detailrow:not(:last-child){border-bottom:1px solid var(--line)}
.detailkey{color:var(--ink-dim);flex:none}
.detailval{color:var(--ink);font-weight:600;text-align:right;word-break:break-word}

/* role gate */
.rolegate{
  position:absolute; inset:0; background:rgba(8,14,28,.55); z-index:60;
  display:flex; align-items:center; justify-content:center; padding:22px;
}
.rolecard{
  position:relative; background:var(--surface); border-radius:18px;
  padding:26px 20px 20px; max-width:340px; width:100%;
  box-shadow:0 20px 50px var(--shadow);
}
.rolecard-title{font-family:"Archivo";font-weight:800;font-size:19px;text-wrap:balance}
.rolecard-sub{font-size:13px;color:var(--ink-dim);margin-top:6px;line-height:1.4}
.roleopt{
  width:100%; text-align:left; border:1px solid var(--line-strong); background:var(--surface);
  border-radius:13px; padding:14px 15px; margin-top:12px;
}
.roleopt:active{background:var(--surface-2)}
.roleopt b{display:block;font-size:15px}
.roleopt span{display:block;font-size:12px;color:var(--ink-dim);margin-top:3px}
.rolecard .sheet-close{position:absolute;top:14px;right:14px}
.langtoggle-card{
  position:absolute; top:14px; left:14px;
  font-size:10.5px; font-weight:700; letter-spacing:.3px;
  background:var(--surface-2); color:var(--ink-dim); border:none;
  padding:5px 10px; border-radius:999px; font-family:"IBM Plex Mono",monospace;
}
.langtoggle-card:active{background:var(--surface-3)}

/* toast */
.toast{
  position:absolute; left:16px; right:16px; bottom:18px; z-index:50;
  background:var(--ink); color:var(--paper); padding:12px 16px; border-radius:12px;
  font-size:13.5px; font-weight:500; box-shadow:0 10px 24px var(--shadow);
  animation:rise .18s ease-out;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.toast-retry{
  flex:none; border:none; background:rgba(255,255,255,.18); color:inherit;
  font-weight:700; font-size:12.5px; padding:6px 12px; border-radius:8px;
}
.toast-retry:active{background:rgba(255,255,255,.3)}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div id="app"></div>
<script id="app-data" type="application/json">{"seq":10,"trucks":[],"adminCode":"1234"}</script>
<script>
(function(){
"use strict";
var APP_JS_SOURCE = document.currentScript.textContent;

/* ---------- constants ---------- */
// Paste the Google Apps Script Web App URL here (see Code.gs) to connect
// this app to the "NPA - INBOUND" Google Sheet as its shared backend.
// Leave empty to keep using the built-in demo data (Claude artifact sync
// when hosted there, or this browser's local storage when hosted elsewhere).
var SHEETS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycby8MdrFns_eU2y4oyqgxw9k2G3FyGuc7_e-OaQftEUjh4a0i8SJWn772yMHuSC9T0MNag/exec";
var SHEETS_POLL_MS = 25000;
var GRACE_MIN = 20;
var ROLE_KEY = "mon-inbound-role";
var DAY_LABELS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var MONTH_LABELS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var DAY_LABELS_TH = ["วันอาทิตย์","วันจันทร์","วันอังคาร","วันพุธ","วันพฤหัสบดี","วันศุกร์","วันเสาร์"];
var MONTH_LABELS_TH = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];

var CSS_TEXT = document.getElementById("app-styles").textContent;
// Manifest/icon/theme-color tags (installable "Add to Home Screen" support) —
// captured live so their markup (incl. the embedded icons) never has to be
// duplicated in this script's source; reused verbatim on every republish.
var PWA_HEAD_IDS = ["pwa-manifest","pwa-touch-icon","pwa-icon","pwa-theme-color","pwa-mobile-capable","pwa-apple-capable","pwa-apple-status-bar","pwa-apple-title"];
var PWA_HEAD_TEXT = PWA_HEAD_IDS.map(function(id){
  var el = document.getElementById(id);
  return el ? el.outerHTML : "";
}).join("");

/* ---------- role (per-device, kept in this browser only) ---------- */
function loadRole(){ try{ return localStorage.getItem(ROLE_KEY); }catch(e){ return null; } }
function saveRoleLocal(r){ try{ localStorage.setItem(ROLE_KEY, r); }catch(e){} }

/* ---------- display language (per device): most of the floor staff read
   Thai only, so Thai is the default; management can switch to English with
   the small EN/TH pill in the header. Not a login — purely a display choice,
   remembered per phone. ---------- */
var LANG_KEY = "mon-inbound-lang";
function loadLang(){ try{ return localStorage.getItem(LANG_KEY) || "th"; }catch(e){ return "th"; } }
function saveLangLocal(l){ try{ localStorage.setItem(LANG_KEY, l); }catch(e){} }

/* ---------- remembered name (per device, for the optional "who did this"
   field on start/finish — not a login, just saves retyping it). ---------- */
var NAME_KEY = "mon-inbound-name";
function loadSavedName(){ try{ return localStorage.getItem(NAME_KEY) || ""; }catch(e){ return ""; } }
function saveNameLocal(n){ try{ localStorage.setItem(NAME_KEY, n); }catch(e){} }

/* ---------- standalone fallback (outside the Claude artifact host, e.g. Netlify):
   there is no shared publish, so the truck data is kept in THIS browser's
   localStorage instead, purely so a page refresh doesn't lose it. When running
   as a Claude artifact this is never consulted — the republished document is
   the shared source of truth there. ---------- */
var DATA_KEY = "mon-inbound-data";
function loadLocalData(){ try{ var raw = localStorage.getItem(DATA_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } }
function saveLocalData(s){ try{ localStorage.setItem(DATA_KEY, JSON.stringify(s)); }catch(e){} }

/* ---------- Google Sheets backend (optional): when SHEETS_WEBAPP_URL is set,
   truck data is read from / written to the "NPA - INBOUND" sheet through the
   Apps Script Web App (see Code.gs) instead of the artifact/localStorage
   paths above. Everything else (role, admin PIN) still uses those. ---------- */
function sheetsEnabled(){ return !!SHEETS_WEBAPP_URL; }
function mapSheetRowToTruck(row){
  var etaDate = row.eta ? new Date(row.eta) : null;
  var status = "scheduled";
  if(row.state === "completed") status = "done";
  else if(row.state === "arrived") status = "unloading";
  return {
    id: row.id,
    carrier: row.carrier || "",
    plant: row.plant || "",
    imExTr: row.imExTr || "",
    poNo: row.poNo || "",
    skuNo: row.skuNo || "",
    qtt: row.qtt || "",
    contNo: row.contNo || "",
    sealNo: row.sealNo || "",
    contType: row.contType || "",
    closingDate: row.closingDate || "",
    remark: row.remark || "",
    details: row.details || "",
    date: etaDate ? dateKey(etaDate) : (row.orderDate || todayKey()),
    eta: etaDate ? (pad2(etaDate.getHours())+":"+pad2(etaDate.getMinutes())) : null,
    status: status,
    startedAt: row.actualArrival ? new Date(row.actualArrival).toISOString() : null,
    finishedAt: row.actualDeparture ? new Date(row.actualDeparture).toISOString() : null,
    startPhotoUrl: row.startPhotoUrl || "",
    finishPhotoUrl: row.finishPhotoUrl || "",
    startedBy: row.startedBy || "",
    finishedBy: row.finishedBy || ""
  };
}
function sheetsAction(action, payload){
  payload = payload || {};
  payload.action = action;
  return fetch(SHEETS_WEBAPP_URL, {
    method: "POST",
    body: JSON.stringify(payload),
    headers: { "Content-Type": "text/plain;charset=utf-8" }
  }).then(function(res){ return res.json(); }).then(function(json){
    if(json && json.ok === false){
      var e = new Error(json.error || "Sheet update failed");
      e.conflict = !!json.conflict;
      e.code = json.code || null;
      throw e;
    }
    return json;
  });
}
function loadFromSheets(){
  return fetch(SHEETS_WEBAPP_URL).then(function(res){ return res.json(); }).then(function(json){
    if(json && json.error) throw new Error(json.error);
    state.trucks = ((json && json.trucks) || []).map(mapSheetRowToTruck);
    ui.syncStatus = "synced";
    render();
  }).catch(function(err){
    ui.syncStatus = "error";
    render();
  });
}

/* ---------- state ---------- */
var state = JSON.parse(document.getElementById("app-data").textContent);
if(state.adminCode == null) state.adminCode = "1234";
var ui = {
  tab: "today",
  openId: null,
  addOpen: false,
  addDefaultDate: null,
  confirmDelete: null,
  toast: null,
  role: loadRole(),
  roleGateOpen: false,
  roleGateStep: "choose",
  roleGateError: null,
  pinSettingsOpen: false,
  pinSettingsError: null,
  photoPrompt: null,
  retryAction: null,
  lang: loadLang(),
  syncStatus: (sheetsEnabled() || window.claude) ? "connecting" : "local"
};
ui.roleGateOpen = !ui.role;
var artifactCap = null;
var tickCount = 0;

/* ---------- date helpers ---------- */
function pad2(n){ return (n<10?"0":"")+n; }
function dateKey(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function addDays(key,n){
  var p = key.split("-").map(Number);
  var d = new Date(p[0], p[1]-1, p[2]);
  d.setDate(d.getDate()+n);
  return dateKey(d);
}
function todayKey(){ return dateKey(new Date()); }
function shortDate(key){
  var p = key.split("-").map(Number);
  return pad2(p[2])+"/"+pad2(p[1]);
}
function longDate(d){
  if(ui.lang === "th"){
    return DAY_LABELS_TH[d.getDay()]+"ที่ "+d.getDate()+" "+MONTH_LABELS_TH[d.getMonth()]+" "+(d.getFullYear()+543);
  }
  return DAY_LABELS[d.getDay()]+" "+MONTH_LABELS[d.getMonth()]+" "+d.getDate();
}
function clockStr(d){ return pad2(d.getHours())+":"+pad2(d.getMinutes())+":"+pad2(d.getSeconds()); }
function dateTimeOf(dateKeyStr, hm){
  var dp = dateKeyStr.split("-").map(Number);
  var tp = hm.split(":").map(Number);
  return new Date(dp[0], dp[1]-1, dp[2], tp[0], tp[1], 0);
}
function fmtHM(mins){
  mins = Math.max(0, Math.round(mins));
  if(mins < 60) return mins + " " + tr("unit_min");
  var h = Math.floor(mins/60), m = mins%60;
  return h + "h" + pad2(m);
}
function fmtElapsed(ms){
  var s = Math.max(0, Math.floor(ms/1000));
  var h = Math.floor(s/3600); s -= h*3600;
  var m = Math.floor(s/60); s -= m*60;
  if(h>0) return h+":"+pad2(m)+":"+pad2(s);
  return pad2(m)+":"+pad2(s);
}
function esc(str){
  return String(str==null?"":str).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}

/* ---------- bilingual strings (English / Thai) ---------- */

/* ---------- arrival/completion photos (only meaningful when a Google Sheet
   is connected — see sheetsEnabled() — since that's the only backend here
   that can actually keep a file long-term). Photos are resized client-side
   before upload so they stay small on a mobile connection. ---------- */
function buzz(ms){
  try{ if(navigator.vibrate) navigator.vibrate(ms || 25); }catch(e){}
}
function readAndCompressImage(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        canvas.getContext("2d").drawImage(img, 0, 0, cw, ch);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = function(){ reject(new Error("Could not read image")); };
      img.src = reader.result;
    };
    reader.onerror = function(){ reject(new Error("Could not read file")); };
    reader.readAsDataURL(file);
  });
}

/* ---------- derived status ---------- */
function derive(t, now){
  if(t.status === "done") return "done";
  if(t.status === "unloading") return "unloading";
  if(!t.eta){
    return (t.date <= todayKey()) ? "urgent" : "pending";
  }
  if(t.date === todayKey()){
    var eta = dateTimeOf(t.date, t.eta);
    if(now.getTime() > eta.getTime() + GRACE_MIN*60000) return "late";
  }
  return "scheduled";
}
function lateMinutes(t, now){
  var eta = dateTimeOf(t.date, t.eta);
  return Math.floor((now.getTime()-eta.getTime())/60000);
}
var STATUS_KEYS = {
  pending:"status_pending", urgent:"status_urgent", scheduled:"status_scheduled",
  late:"status_late", unloading:"status_unloading", done:"status_done"
};

/* ---------- rendering ---------- */
function effectiveTab(){ return ui.role === "driver" ? "today" : ui.tab; }
function pill(derived, t, now){
  var txt = tr(STATUS_KEYS[derived]);
  if(derived === "scheduled") txt = tr("pill_eta") + " " + t.eta;
  if(derived === "late") txt = tr("status_late") + " · " + lateMinutes(t, now) + " " + tr("unit_min");
  if(derived === "unloading") txt = tr("status_unloading") + " · " + fmtElapsed(now - new Date(t.startedAt));
  if(derived === "done" && t.startedAt && t.finishedAt){
    txt = tr("status_done") + " · " + fmtHM((new Date(t.finishedAt)-new Date(t.startedAt))/60000);
  }
  return '<span class="pill '+derived+'">'+esc(txt)+"</span>";
}
function sortWeight(t, now){
  var d = derive(t, now);
  if(d==="urgent"||d==="late") return 0;
  if(d==="unloading") return 1;
  if(d==="scheduled") return 2 + (t.eta ? dateTimeOf(t.date,t.eta).getTime()/1e15 : 0);
  if(d==="pending") return 3;
  return 4;
}
function cardHtml(t, now){
  var d = derive(t, now);
  return '<button class="card" data-open="'+esc(t.id)+'">'+
    '<span class="stripe '+d+'"></span>'+
    '<span class="card-body">'+
      '<span class="card-top"><span class="card-id mono">'+esc(t.poNo || t.id)+"</span>"+pill(d,t,now)+"</span>"+
      '<span class="card-carrier">'+esc(t.carrier)+"</span>"+
      '<span class="card-meta">'+
      (t.plant ? "<span>"+esc(t.plant)+"</span>" : "")+
      "<span>"+shortDate(t.date)+"</span>"+
      (t.imExTr ? "<span>"+esc(t.imExTr)+"</span>" : "")+
      "</span>"+
    "</span>"+
  "</button>";
}
function kpiHtml(trucks, now){
  var today = trucks.filter(function(t){ return t.date === todayKey(); });
  var done = today.filter(function(t){ return t.status === "done"; });
  var working = today.filter(function(t){ return t.status === "unloading"; }).length;
  var late = today.filter(function(t){ return derive(t, now) === "late" || derive(t, now) === "urgent"; }).length;
  var avg = done.length ? done.reduce(function(sum,t){ return sum + (new Date(t.finishedAt)-new Date(t.startedAt))/60000; }, 0)/done.length : null;
  var items = [
    {v: today.length, l:tr("kpiToday"), cls:""},
    {v: done.length, l:tr("kpiCompleted"), cls:"good"},
    {v: working, l:tr("kpiInProgress"), cls: working ? "warn" : ""},
    {v: late, l:tr("kpiLate"), cls: late ? "bad" : ""},
    {v: avg==null ? "—" : fmtHM(avg), l:tr("kpiAvgTime"), cls:""}
  ];
  return items.map(function(k){
    return '<div class="kpi '+k.cls+'"><div class="v mono">'+k.v+'</div><div class="l">'+k.l+"</div></div>";
  }).join("");
}
function tabsHtml(trucks){
  var keys = { yesterday: addDays(todayKey(),-1), today: todayKey(), tomorrow: addDays(todayKey(),1) };
  var labels = { yesterday:tr("tabYesterday"), today:tr("tabToday"), tomorrow:tr("tabTomorrow") };
  return Object.keys(keys).map(function(k){
    var n = trucks.filter(function(t){ return t.date === keys[k]; }).length;
    return '<button class="tab'+(ui.tab===k?" active":"")+'" data-tab="'+k+'">'+
      '<span class="n mono">'+n+'</span>'+labels[k]+"</button>";
  }).join("");
}
function listHtml(trucks, now){
  var keys = { yesterday: addDays(todayKey(),-1), today: todayKey(), tomorrow: addDays(todayKey(),1) };
  var dayTrucks = trucks.filter(function(t){ return t.date === keys[effectiveTab()]; });
  dayTrucks.sort(function(a,b){ return sortWeight(a,now) - sortWeight(b,now); });
  if(!dayTrucks.length){
    return '<div class="empty"><span class="empty-icon">🚚</span><div>'+tr("noTrucksToday")+'</div></div>';
  }
  // A short list on a tall phone screen (especially standalone/home-screen
  // mode, which has no browser chrome eating into the viewport) can leave a
  // large blank area below the cards that reads as broken rather than
  // intentional. This closing line turns that empty space into a deliberate
  // "end of list" instead of an unexplained void.
  return dayTrucks.map(function(t){ return cardHtml(t, now); }).join("")+
    '<div class="list-end">'+tr("endOfList")+'</div>';
}

function sheetHtml(now){
  if(ui.pinSettingsOpen) return pinSettingsHtml();
  if(ui.addOpen) return addSheetHtml();
  if(!ui.openId) return "";
  var t = state.trucks.find(function(x){ return x.id === ui.openId; });
  if(!t) return "";
  var d = derive(t, now);
  var body = "";
  var isAdmin = ui.role === "admin";

  if(d==="pending" || d==="urgent" || d==="scheduled" || d==="late"){
    if(isAdmin){
      body += '<div class="sheet-section"><div class="label">'+tr("etaLabel")+'</div>'+
        '<input class="field" type="time" id="etaInput" value="'+(t.eta||"")+'">'+
        '<button class="btn primary" data-save-eta="'+esc(t.id)+'">'+(t.eta?tr("updateTime"):tr("saveTime"))+'</button></div>';
      if(d==="late") body += '<div class="hint" style="color:var(--bad);text-align:center;margin-top:10px">'+lateHintAdminText(lateMinutes(t,now))+'</div>';
      if(t.date === todayKey() && t.eta){
        body += '<button class="btn go" data-start="'+esc(t.id)+'">'+tr("startUnloading")+'</button>';
      } else if(t.date !== todayKey()){
        body += '<div class="hint" style="text-align:center;margin-top:12px">'+canStartOnText(shortDate(t.date))+'</div>';
      }
    } else {
      if(!t.eta){
        body += '<div class="hint" style="text-align:center;margin-top:10px">'+tr("waitingEta")+'</div>';
      } else {
        body += '<div class="timer" style="font-size:30px">'+t.eta+'</div><div class="timer-sub">'+tr("scheduledArrivalTime")+'</div>';
        if(d==="late") body += '<div class="hint" style="color:var(--bad);text-align:center;margin-top:6px">'+lateHintDriverText(lateMinutes(t,now))+'</div>';
        if(t.date === todayKey()){
          body += '<button class="btn go" data-start="'+esc(t.id)+'">'+tr("startUnloading")+'</button>';
        } else {
          body += '<div class="hint" style="text-align:center;margin-top:12px">'+canStartOnText(shortDate(t.date))+'</div>';
        }
      }
    }
  } else if(d==="unloading"){
    var elapsed = now - new Date(t.startedAt);
    body += '<div class="timer big-work" id="liveTimer">'+fmtElapsed(elapsed)+'</div>'+
      '<div class="timer-sub">'+startedAtText(new Date(t.startedAt).toTimeString().slice(0,5))+'</div>'+
      '<button class="btn stop" data-finish="'+esc(t.id)+'">'+tr("finishUnloading")+'</button>'+
      '<button class="linklike" data-cancel="'+esc(t.id)+'">'+tr("cancelStartLink")+'</button>'+
      photoLinksHtml(t);
  } else if(d==="done"){
    var durMin = (new Date(t.finishedAt)-new Date(t.startedAt))/60000;
    body += '<div class="done-summary">'+
      '<div><b>'+new Date(t.startedAt).toTimeString().slice(0,5)+'</b><span>'+tr("lblStart")+'</span></div>'+
      '<div><b>'+new Date(t.finishedAt).toTimeString().slice(0,5)+'</b><span>'+tr("lblEnd")+'</span></div>'+
      '<div><b>'+fmtHM(durMin)+'</b><span>'+tr("lblDuration")+'</span></div>'+
      '</div>'+
      photoLinksHtml(t);
    if(isAdmin) body += '<button class="linklike" data-reopen="'+esc(t.id)+'">'+tr("reopenUnloading")+'</button>';
  }

  body += deleteControl(t.id);

  return '<div class="scrim" data-scrim="1"><div class="sheet">'+
    '<div class="sheet-handle"></div>'+
    '<div class="sheet-head"><div><div class="sheet-id mono">'+esc(t.poNo || t.id)+'</div>'+
    '<div class="sheet-carrier">'+esc(t.carrier)+'</div></div>'+
    '<button class="sheet-close" data-close="1">✕</button></div>'+
    '<div class="sheet-meta">'+
    (t.plant?'<span class="chip">'+esc(t.plant)+'</span>':"")+
    '<span class="chip">'+shortDate(t.date)+'</span>'+
    (t.imExTr?'<span class="chip">'+esc(t.imExTr)+'</span>':"")+
    '</div>'+
    shipmentDetailsHtml(t)+
    body+
  '</div></div>';
}
function detailRow(label, val){
  if(val == null || val === "") return "";
  return '<div class="detailrow"><span class="detailkey">'+esc(label)+'</span><span class="detailval">'+esc(val)+'</span></div>';
}
function shipmentDetailsHtml(t){
  var rows =
    detailRow(tr("detProduct"), t.details)+

/* ---------- persistence ---------- */
function buildFullDocument(newState){
  var head =
    '<meta charset="UTF-8">'+
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'+
    '<title>MON Inbound</title>'+
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">'+
    PWA_HEAD_TEXT+
    '<style id="app-styles">'+CSS_TEXT+"</style>";
  var stateJson = JSON.stringify(newState).replace(/</g, "\\u003c");
  var body =
    '<div id="app"></div>'+
    '<script id="app-data" type="application/json">'+stateJson+"<"+"/script>"+
    "<script>"+APP_JS_SOURCE+"<"+"/script>";
  return "<!doctype html>\n<html lang=\""+(ui.lang==="th"?"th":"en")+"\">\n<head>"+head+"</head>\n<body>"+body+"</body>\n</html>";
}
function showToast(msg, sticky){
  ui.toast = msg;
  render();
  if(!sticky){
    var mine = msg;
    setTimeout(function(){ if(ui.toast === mine){ ui.toast = null; ui.retryAction = null; render(); } }, 2600);
  }
}
function persist(mutator){
  mutator();
  render();
  if(!artifactCap){
    saveLocalData(state);
    return;
  }
  ui.syncStatus = "saving";
  render();
  var snapshot = JSON.parse(JSON.stringify(state));
  artifactCap.publish(buildFullDocument(snapshot)).then(function(){
    /* view reloads automatically on success */
  }).catch(function(err){
    var code = err && err.code;
    if(code === "conflict"){ return; }
    ui.syncStatus = "error";
    render();
    showToast(tr("couldNotSaveNow"));
  });
}
/* Truck lifecycle actions (ETA, start/finish/cancel/reopen unload) go through
   here so that, when a Google Sheet is connected, they write to the sheet
   instead of publishing/localStorage. Everything else (role, admin PIN,
   add/delete truck) keeps using persist() above unchanged. */
function runSheetsCall(sheetsCall){
  ui.syncStatus = "saving";
  ui.retryAction = null;
  render();
  sheetsCall().then(function(){
    return loadFromSheets();
  }).catch(function(err){
    if(err && err.conflict){
      /* Someone else already changed this truck's state (double-tap from two
         phones, etc.) — retrying the same action would just fail again, so
         instead pull the real current state from the sheet. */
      ui.syncStatus = "synced";
      var conflictKey = err.code ? "conflict_"+err.code : null;
      showToast((conflictKey && STRINGS[conflictKey]) ? tr(conflictKey) : tr("conflictRefreshedDefault"));
      loadFromSheets();
      return;
    }
    ui.syncStatus = "error";
    ui.retryAction = function(){ runSheetsCall(sheetsCall); };
    render();
    showToast((err && err.message) || tr("couldNotSaveSheet"), true);
  });
}
function persistTruck(mutator, sheetsCall){
  if(sheetsEnabled()){
    mutator();
    render();
    if(!sheetsCall) return;
    runSheetsCall(sheetsCall);
    return;
  }
  persist(mutator);
}

  }, 30);

function submitPin(){
  var el = document.getElementById("pinInput");
  var v = el ? el.value : "";
  if(v && v === state.adminCode){
    pickRole("admin");
  } else {
    ui.roleGateError = tr("incorrectPin");

function savePin(){
  var cur = (document.getElementById("pin-current")||{}).value || "";
  var next = (document.getElementById("pin-new")||{}).value || "";
  var confirm = (document.getElementById("pin-confirm")||{}).value || "";
  if(cur !== state.adminCode){ ui.pinSettingsError = tr("pinErrCurrent"); render(); return; }
  if(!next || next.length < 4){ ui.pinSettingsError = tr("pinErrLength"); render(); return; }
  if(next !== confirm){ ui.pinSettingsError = tr("pinErrMismatch"); render(); return; }
  persist(function(){ state.adminCode = next; });
  ui.pinSettingsOpen = false;
  showToast(tr("pinUpdatedToast"));
}
function saveEta(id){
  var v = document.getElementById("etaInput").value;
  if(!v){ showToast(tr("chooseATime")); return; }
  var t = findTruck(id);
  var etaIso = t ? dateTimeOf(t.date, v).toISOString() : null;
  persistTruck(function(){
    t.eta = v;
    t.status = "scheduled";
  }, sheetsEnabled() ? function(){ return sheetsAction("setEta", {id:id, etaIso:etaIso}); } : null);
  ui.openId = null;
  showToast(tr("timeSaved"));
}
function startUnload(id, photoBase64, by){
  var timestampIso = new Date().toISOString();
  persistTruck(function(){
    var t = findTruck(id);
    t.status = "unloading";
    t.startedAt = timestampIso;
    if(by) t.startedBy = by;
  }, sheetsEnabled() ? function(){ return sheetsAction("start", {id:id, timestampIso:timestampIso, photoBase64: photoBase64 || null, by: by || null}); } : null);
}
function finishUnload(id, photoBase64, by){
  var t = findTruck(id);
  var timestampIso = new Date().toISOString();
  var durationStr = null;
  if(t && t.startedAt){
    var mins = Math.round((new Date(timestampIso) - new Date(t.startedAt))/60000);
    durationStr = Math.floor(mins/60)+":"+pad2(mins%60);
  }
  persistTruck(function(){
    t.status = "done";
    t.finishedAt = timestampIso;
    if(by) t.finishedBy = by;
  }, sheetsEnabled() ? function(){ return sheetsAction("finish", {id:id, timestampIso:timestampIso, duration:durationStr, photoBase64: photoBase64 || null, by: by || null}); } : null);
}
function cancelUnload(id){
  persistTruck(function(){
    var t = findTruck(id);
    t.status = "scheduled";
    t.startedAt = null;
  }, sheetsEnabled() ? function(){ return sheetsAction("cancelStart", {id:id}); } : null);
}
function reopenUnload(id){
  persistTruck(function(){
    var t = findTruck(id);
    t.status = "unloading";
    t.finishedAt = null;
  }, sheetsEnabled() ? function(){ return sheetsAction("reopen", {id:id}); } : null);
}
function deleteTruck(id){
  persist(function(){
    state.trucks = state.trucks.filter(function(t){ return t.id !== id; });
  });
  ui.openId = null; ui.confirmDelete = null;
  showToast(tr("truckDeleted"));
}
function createTruck(){
  var carrier = document.getElementById("f-carrier").value.trim();
  var plant = document.getElementById("f-plant").value.trim();
  var ref = document.getElementById("f-ref").value.trim();
  var date = document.getElementById("f-date").value;
  var eta = document.getElementById("f-eta").value;
  if(!carrier || !plant || !date){ showToast(tr("fillRequiredFields")); return; }
  persist(function(){
    state.seq += 1;
    state.trucks.push({
      id: "T-"+String(state.seq).padStart(4,"0"),
      carrier: carrier, plant: plant, poNo: ref || null,
      date: date, eta: eta || null,
      status: "scheduled",
      startedAt: null, finishedAt: null
    });
  });
  ui.addOpen = false;
  showToast(tr("truckAdded"));
}

/* ---------- event delegation ---------- */
document.getElementById("app").addEventListener("click", function(e){
  var el = e.target;
  var pickEl = el.closest("[data-pick-role]");
  if(pickEl){ pickRole(pickEl.getAttribute("data-pick-role")); return; }
  var stepEl = el.closest("[data-role-step]");
  if(stepEl){ ui.roleGateStep = stepEl.getAttribute("data-role-step"); ui.roleGateError = null; render(); focusPin(); return; }
  if(el.closest("[data-role-back]")){ ui.roleGateStep = "choose"; ui.roleGateError = null; render(); return; }
  if(el.closest("[data-pin-submit]")){ submitPin(); return; }
  if(el.closest("[data-role-close]")){ ui.roleGateOpen = false; render(); return; }
  if(el.closest("[data-toggle-lang]")){
    ui.lang = ui.lang === "th" ? "en" : "th";
    saveLangLocal(ui.lang);
    render();
    return;
  }
  if(el.closest("[data-role-switch]")){
    ui.roleGateOpen = true; ui.roleGateStep = "choose"; ui.roleGateError = null;
    ui.openId = null; ui.addOpen = false; render(); return;
  }
  if(el.closest("[data-open-pin-settings]")){
    ui.pinSettingsOpen = true; ui.pinSettingsError = null;
    ui.openId = null; ui.addOpen = false; render(); return;
  }
  var savePinEl = el.closest("[data-save-pin]");
  if(savePinEl){ savePin(); return; }
  var open = el.closest("[data-open]");
  if(open){ openSheet(open.getAttribute("data-open")); return; }
  if(el.closest("[data-add]")){ openAdd(); return; }
  if(el.closest("[data-close]") || el === el.closest(".scrim")){
    if(el.classList.contains("scrim") || el.closest("[data-close]")) closeSheet();
    return;
  }
  var saveEl = el.closest("[data-save-eta]");
  if(saveEl){ saveEta(saveEl.getAttribute("data-save-eta")); return; }
  var startEl = el.closest("[data-start]");
  if(startEl){
    var startId = startEl.getAttribute("data-start");
    buzz();
    if(sheetsEnabled()){ ui.photoPrompt = {action:"start", id:startId, dataUrl:null, name:loadSavedName()}; render(); }
    else { startUnload(startId); }
    return;
  }
  var finishEl = el.closest("[data-finish]");
  if(finishEl){
    var finishId = finishEl.getAttribute("data-finish");
    buzz();
    if(sheetsEnabled()){ ui.photoPrompt = {action:"finish", id:finishId, dataUrl:null, name:loadSavedName()}; render(); }
    else { finishUnload(finishId); }
    return;
  }
  if(el.closest("[data-photo-cancel]")){ ui.photoPrompt = null; render(); return; }
  if(el.closest("[data-photo-skip]")){
    var skipped = ui.photoPrompt; ui.photoPrompt = null;
    var skipName = (document.getElementById("photoNameInput")||{}).value || "";
    if(skipName) saveNameLocal(skipName);
    buzz();
    if(skipped){ if(skipped.action==="start") startUnload(skipped.id, null, skipName); else finishUnload(skipped.id, null, skipName); }
    return;
  }
  if(el.closest("[data-photo-confirm]")){
    var confirmed = ui.photoPrompt; ui.photoPrompt = null;
    var confirmName = (document.getElementById("photoNameInput")||{}).value || "";
    if(confirmName) saveNameLocal(confirmName);
    buzz();
    if(confirmed){ if(confirmed.action==="start") startUnload(confirmed.id, confirmed.dataUrl, confirmName); else finishUnload(confirmed.id, confirmed.dataUrl, confirmName); }
    return;
  }
  var cancelEl = el.closest("[data-cancel]");
  if(cancelEl){ cancelUnload(cancelEl.getAttribute("data-cancel")); return; }
  var reopenEl = el.closest("[data-reopen]");
  if(reopenEl){ reopenUnload(reopenEl.getAttribute("data-reopen")); return; }
  var delEl = el.closest("[data-delete]");
  if(delEl){ ui.confirmDelete = delEl.getAttribute("data-delete"); render(); return; }
  var delConfirmEl = el.closest("[data-delete-confirm]");
  if(delConfirmEl){ deleteTruck(delConfirmEl.getAttribute("data-delete-confirm")); return; }
  var createEl = el.closest("[data-create]");
  if(createEl){ createTruck(); return; }
  var tabEl = el.closest("[data-tab]");
  if(tabEl){ ui.tab = tabEl.getAttribute("data-tab"); render(); return; }
  if(el.closest("[data-toast-retry]")){
    var retry = ui.retryAction;
    ui.toast = null; ui.retryAction = null;
    render();
    if(retry) retry();
    return;
  }
});
document.getElementById("app").addEventListener("keydown", function(e){
  if(e.key === "Enter" && e.target && e.target.id === "pinInput"){ submitPin(); }
});
document.getElementById("app").addEventListener("change", function(e){
  if(e.target && e.target.id === "photoInput" && ui.photoPrompt){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var prompt = ui.photoPrompt;
    readAndCompressImage(file, 1280, 0.7).then(function(dataUrl){
      if(ui.photoPrompt === prompt){ ui.photoPrompt.dataUrl = dataUrl; render(); }
    }).catch(function(){
      showToast("Could not read that photo.");
    });
  }
});

/* ---------- init ---------- */
if(sheetsEnabled()){
  /* Google Sheet is the shared source of truth for truck data: load it now
     and keep polling it, skipping a refresh while someone has an input open
     (an ETA edit, the add form, PIN entry) so it doesn't get clobbered. */
  loadFromSheets();
  setInterval(function(){
    if(!isInputSheetOpen()) loadFromSheets();
  }, SHEETS_POLL_MS);
  /* Also refresh right away when someone comes back to the app (phone woken
     up, tab switched back to) instead of waiting for the next poll tick —
     a driver reopening the app should see the latest state immediately. */
  var lastVisRefresh = 0;
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState !== "visible") return;
    if(isInputSheetOpen()) return;
    if(Date.now() - lastVisRefresh < 3000) return;
    lastVisRefresh = Date.now();
    loadFromSheets();
  });
} else if(!(window.claude && window.claude.use)){
  /* Not running inside a Claude artifact host (e.g. deployed standalone,
     such as on Netlify) — hydrate from this browser's own saved copy, if any,
     so a page refresh doesn't wipe out what was entered. */
  var cachedAtStart = loadLocalData();
  if(cachedAtStart){ state = cachedAtStart; }
}
render();
setInterval(tick, 1000);
if(!sheetsEnabled() && window.claude && window.claude.use){
  window.claude.use("artifact").then(function(cap){
    artifactCap = cap;
    if(!cap){
      var cachedLater = loadLocalData();
      if(cachedLater){ state = cachedLater; }
    }
    ui.syncStatus = cap ? "synced" : "local";
    render();
  }).catch(function(){
    var cachedErr = loadLocalData();
    if(cachedErr){ state = cachedErr; }
    ui.syncStatus = "local";
    render();
  });
}
})();
